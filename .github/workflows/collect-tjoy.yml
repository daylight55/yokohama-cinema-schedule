name: Collect T-Joy schedules
on:
  schedule:
    - cron: '37 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-tjoy
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/collect-tjoy.ts
        env:
          COLLECTOR_ORIGIN: https://yokohama-cinema-schedule-refresh.jojomasanori3.workers.dev
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
      - name: Verify all active cinemas
        if: always()
        run: curl --fail --silent --show-error --retry 2 --retry-delay 10 https://yokohama-cinema-schedule-refresh.jojomasanori3.workers.dev/health
