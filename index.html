<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d1211" />
    <script>
      (() => {
        let theme;
        try {
          const savedTheme = localStorage.getItem("hamamubi-color-theme");
          theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="color-scheme"]')
          ?.setAttribute("content", theme);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#0d1211" : "#fff8ee");
      })();
    </script>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" href="/brand/hamamubi-icon-v2.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/brand/hamamubi-icon-v2-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="/brand/hamamubi-icon-v2-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="横浜駅、桜木町、みなとみらい、関内、伊勢佐木町周辺の映画上映時刻を確認するプライベートサイト"
    />
    <title>はまむび！｜横浜の映画スケジュール</title>
  </head>
  <body>
    <a class="skip-link" href="#main">上映スケジュールへ移動</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
